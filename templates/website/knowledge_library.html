{% extends 'website/base.html' %}
{% load static %}

{% block content %}
<div class="w-full max-w-5xl pb-16">
    <div class="mb-6">
        <h1 class="text-2xl font-bold text-slate-900 dark:text-white sm:text-3xl mb-2">Knowledge Library</h1>
        <p class="text-base text-slate-600 dark:text-slate-300 sm:text-lg">Browse and filter your research documents.</p>
    </div>

    <div class="sticky top-0 z-10 mb-6 grid items-end gap-4 md:grid-cols-[220px_1fr_auto] bg-white/95 dark:bg-surface-dark/95 border border-slate-200/80 dark:border-[#283039] backdrop-blur-sm py-3 px-3 rounded-2xl shadow-sm w-full">
        <div class="flex flex-col justify-end">
            <select id="boundaryFilter"
                class="w-full rounded-lg border border-slate-200 dark:border-[#334155] bg-white dark:bg-surface-dark px-3 py-2 text-sm text-slate-700 dark:text-slate-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary/40">
                <option value="all">All boundaries</option>
            </select>
        </div>
        <div class="relative flex flex-col justify-end">
            <input id="librarySearch" type="text" placeholder="Search title, abstract, authors"
                class="w-full rounded-lg border border-slate-200 dark:border-[#334155] bg-white dark:bg-surface-dark py-2 pl-3 pr-9 text-sm text-slate-700 dark:text-slate-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary/40" />
            <button id="librarySearchClear" type="button" aria-label="Clear search"
                class="absolute right-2 top-1/2 hidden -translate-y-1/2 text-slate-400 hover:text-slate-700 dark:hover:text-slate-200">
                <span class="material-symbols-outlined text-[16px]">close</span>
            </button>
        </div>
        <button id="librarySearchButton" type="button" aria-label="Search"
            class="flex h-9 w-9 items-center justify-center rounded-lg bg-primary text-white shadow-sm hover:bg-primary/90 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary/40">
            <span class="material-symbols-outlined text-[18px]">search</span>
        </button>
    </div>

    <div class="relative rounded-2xl border border-slate-200 dark:border-[#283039] bg-white/70 dark:bg-surface-dark/80 p-4 shadow-sm">
        <div id="documentList" class="flex flex-col gap-3"></div>
        <div id="documentEmptyState" class="hidden flex flex-col items-center justify-center py-12 text-center text-slate-500 dark:text-slate-400">
            <span class="material-symbols-outlined text-slate-400 text-[64px] opacity-50 mb-4">description</span>
            <p id="documentEmptyTitle" class="font-medium text-lg">No documents yet</p>
            <p id="documentEmptyBody" class="text-sm mt-2">Upload your research documents to build your library.</p>
        </div>
        <div id="knowledgeLoadingOverlay" class="hidden absolute inset-0 rounded-2xl bg-white/70 dark:bg-surface-dark/70 backdrop-blur-sm flex items-center justify-center">
            <div class="flex items-center gap-2 text-sm font-semibold text-slate-600 dark:text-slate-200">
                <span class="inline-block h-4 w-4 rounded-full border-2 border-primary/30 border-t-primary animate-spin"></span>
                Searching…
            </div>
        </div>
    </div>

    <div id="knowledgePagination" class="mt-5 flex flex-wrap items-center justify-between gap-3 text-sm text-slate-500 dark:text-slate-400">
        <button id="prevPage" type="button"
            class="rounded-lg border border-slate-200 dark:border-[#334155] px-3 py-2 text-sm font-semibold text-slate-600 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-surface-highlight disabled:cursor-not-allowed disabled:opacity-50">
            Previous
        </button>
        <div id="pageNumbers" class="flex items-center gap-1"></div>
        <button id="nextPage" type="button"
            class="rounded-lg border border-slate-200 dark:border-[#334155] px-3 py-2 text-sm font-semibold text-slate-600 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-surface-highlight disabled:cursor-not-allowed disabled:opacity-50">
            Next
        </button>
    </div>
</div>
{% endblock %}

{% block body_end %}
<script src="{% static 'website/assets/js/main.knowledge.js' %}?v={% now "U" %}" type="text/javascript"></script>
{% endblock %}
