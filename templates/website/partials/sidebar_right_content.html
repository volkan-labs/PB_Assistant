<div class="right-sidebar-header flex items-center justify-between px-4 py-4 border-b border-slate-100 dark:border-slate-800/50">
    <h3 class="right-sidebar-title text-sm font-semibold text-slate-900 dark:text-white">Insights</h3>
    <button id="rightSidebarCollapseToggle" type="button" aria-label="Collapse right sidebar"
        class="flex h-8 w-8 items-center justify-center rounded-md text-slate-400 hover:bg-slate-100 hover:text-slate-700 dark:hover:bg-slate-800/60 dark:hover:text-slate-200 transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-primary/40 focus-visible:ring-offset-2 focus-visible:ring-offset-background-light dark:focus-visible:ring-offset-background-dark">
        <span class="material-symbols-outlined text-[18px] right-pin-icon">push_pin</span>
    </button>
</div>

<div class="right-sidebar-content flex flex-col flex-1 overflow-y-auto">
    <!-- Publications Section -->
    <div class="flex-1 min-h-0 flex flex-col">
    <div class="px-6 py-4">
        <h3 class="text-md font-semibold text-slate-900 dark:text-white mb-2">Planetary boundaries News</h3>
    </div>
        <div class="px-6 pb-4 flex-1 overflow-y-auto">
            <ul id="latest-publications-list" class="focus-within:ring-2 focus-within:ring-primary/40 focus-within:ring-offset-2 focus-within:ring-offset-background-light dark:focus-within:ring-offset-background-dark rounded-lg">
            </ul>
        </div>
    </div>

    <!-- Divider between publications and alerts -->
    <div class="my-2 border-t border-slate-200/70 dark:border-slate-700/70"></div>

    <!-- Alerts Section -->
    <div class="flex-grow-0 flex-shrink-0 basis-[30%] flex flex-col min-h-0">
        <div class="px-6 py-4">
            <h3 class="text-md font-semibold text-slate-900 dark:text-white mb-2">Alerts</h3>
        </div>
        <div class="px-6 pb-4 flex-1 overflow-y-auto">
            <div class="flex flex-col items-center justify-center p-4 text-center rounded-lg text-sm text-slate-500 dark:text-slate-400">
                <span class="material-symbols-outlined text-slate-400 text-[48px] opacity-50 mb-2">notifications</span>
                <p class="font-medium">No new alerts.</p>
                <p class="text-xs mt-1"><a href="{% url 'settings' %}#alerts" class="text-primary hover:text-primary/80 transition-colors">Set up alerts in settings.</a></p>
            </div>
        </div>
    </div>
</div>
